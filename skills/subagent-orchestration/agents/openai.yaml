interface:
  display_name: "Subagent Orchestration"
  short_description: "Main-controller workflows for long-running Codex tasks, multi-agent evidence checks, and test regressions."
  default_prompt: "Use subagent-orchestration to plan, delegate, supervise, hand off, clean up subagents, and verify a long-running multi-agent task. Invoke it as an orchestration helper for server/page regression, business-flow testing, acceptance testing, UI/API/DB evidence runs, coverage matrices, screenshots, logs, JSON evidence, and PASS/FAIL/BLOCKED reports when a controller must accept multiple evidence sources. If the user frames the agent as an architect, reviewer, auditor, code-walk controller, or asks for an implementation plan for later agents, stay in review-only or plan-handoff mode until implementation is explicitly authorized. After authorization, default to delegated-implementation: subagents edit business code while the controller delegates, reviews evidence, resolves conflicts, verifies, and reports. The controller edits business code directly only when the user explicitly asks the controller to do so."
